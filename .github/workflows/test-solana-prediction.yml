name: Solana Prediction SDK
on:
  pull_request:
    paths: ['src/solana/**', 'test/solana/**', 'examples/solana-prediction*', 'examples/solana-prediction/**', 'examples/solana-prediction-browser/**', 'scripts/*prediction*', 'scripts/idl/**', 'tsconfig*', '.github/workflows/test-solana-prediction.yml', 'package.json', 'pnpm-lock.yaml']
  push:
    branches: [main]
    paths: ['src/solana/**', 'test/solana/**', 'examples/solana-prediction*', 'examples/solana-prediction/**', 'examples/solana-prediction-browser/**', 'scripts/*prediction*', 'scripts/idl/**', 'tsconfig*', '.github/workflows/test-solana-prediction.yml', 'package.json', 'pnpm-lock.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:solana
      - run: pnpm typecheck:solana-examples
      - run: pnpm typecheck:prediction-tools
      - name: Build browser walkthrough
        working-directory: examples/solana-prediction-browser
        run: npm ci && npm run build
      # Run deployed-program fork tests locally or in a temporary external
      # environment; no protocol repository workflow is required.
